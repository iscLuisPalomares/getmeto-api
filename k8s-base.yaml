apiVersion: v1
kind: Namespace
metadata:
  name: dev

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: getmeto-api-config
  namespace: dev
data:
  app_name: "getmeto-api"
  app_env: "dev"
  app_debug: "false"
  app_host: "0.0.0.0"
  app_port: "8000"

---
apiVersion: v1
kind: Service
metadata:
  name: getmeto-api
  namespace: dev
spec:
  selector:
    app.kubernetes.io/name: getmeto-api
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP