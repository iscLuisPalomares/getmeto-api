name: Build

on:
    push:
        branches:
            - main

# Only one build workflow can execute the versioning section at a time.
concurrency:
    group: versioning-main
    cancel-in-progress: false

permissions:
    contents: read
    id-token: write

jobs:
    write-something:
        runs-on: ubuntu-latest

        steps:
            - name: run command
              run: |
                  echo "this is from github actions"
    build:
        runs-on: ubuntu-latest
        env:
            AWS_REGION: us-east-1
            ECR_REGISTRY: 343782217094.dkr.ecr.us-east-1.amazonaws.com/mygetmeto_namespace/getmeto
            ECR_REPOSITORY: mygetmeto_namespace/getmeto

        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            # Get the latest version tag and calculate the next one

            - name: Generate version
              id: version
              run: |
                  git fetch --tags

                  latest=$(git tag -l 'v*' --sort=-v:refname | head -n 1)

                  if [ -z "$latest" ]; then
                    next="v1.0.0"
                  else
                    version=${latest#v}
                    major=$(echo "$version" | cut -d. -f1)
                    minor=$(echo "$version" | cut -d. -f2)
                    patch=$(echo "$version" | cut -d. -f3)

                    next="v${major}.${minor}.$((patch + 1))"
                  fi

                  echo "Next version: $next"
                  echo "tag=$next" >> "$GITHUB_OUTPUT"

            # Create the Git tag
            - name: Create tag
              run: |
                  git tag "${{ steps.version.outputs.tag }}"
                  git push origin "${{ steps.version.outputs.tag }}"

            # Build Docker image
            - name: Build Docker image
              run: |
                  docker build \
                    -t my-app:${{ steps.version.outputs.tag }} .

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: arn:aws:iam::343782217094:role/GetMeTo_image_handler
                  aws-region: ${{ env.AWS_REGION }}

            - name: Login to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            # Push image
            - name: Push image
              run: |
                  docker tag \
                    my-app:${{ steps.version.outputs.tag }} \
                    ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.version.outputs.tag }}

                  docker push \
                    ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.version.outputs.tag }}

            # Deploy DEV
            - name: Deploy DEV
              run: |
                  echo "Deploy ${{ steps.version.outputs.tag }} to DEV"
