name: Build

on:
  push:
    branches:
      - main

# Only one build workflow can execute the versioning section at a time.
concurrency:
  group: versioning-main
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Get the latest version tag and calculate the next one

      - name: Generate version
        id: version
        run: |
          git fetch --tags

          latest=$(git tag -l 'v*' --sort=-v:refname | head -n 1)

          if [ -z "$latest" ]; then
            next="v1.0.0"
          else
            version=${latest#v}
            major=$(echo "$version" | cut -d. -f1)
            minor=$(echo "$version" | cut -d. -f2)
            patch=$(echo "$version" | cut -d. -f3)

            next="v${major}.${minor}.$((patch + 1))"
          fi

          echo "Next version: $next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      # Create the Git tag
      - name: Create tag
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      # Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t my-app:${{ steps.version.outputs.tag }} .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::343782217094:role/GetMeTo_ecrimagebuilder_role
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Push image
      - name: Push image
        run: |
          docker tag \
            my-app:${{ steps.version.outputs.tag }} \
            343782217094.dkr.ecr.us-east-1.amazonaws.com/mygetmeto_namespace/getmeto:${{ steps.version.outputs.tag }}

          docker push \
            343782217094.dkr.ecr.us-east-1.amazonaws.com/mygetmeto_namespace/getmeto:${{ steps.version.outputs.tag }}

      # Configure kubectl to talk to the EKS cluster
      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region us-east-1 \
            --name getmeto-cluster

      # Deploy DEV
      - name: Deploy DEV
        run: |
          kubectl set image deployment/getmeto-api \
            api=343782217094.dkr.ecr.us-east-1.amazonaws.com/mygetmeto_namespace/getmeto:${{ steps.version.outputs.tag }} \
            -n dev

          kubectl rollout status deployment/getmeto-api -n dev --timeout=120s