apiVersion: apps/v1
kind: Deployment
metadata:
  name: getmeto-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: getmeto-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: getmeto-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: api
          image: getmeto-api
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: getmeto-api-config
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
